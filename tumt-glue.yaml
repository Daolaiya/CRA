AWSTemplateFormatVersion: '2010-09-09'
Description: "This nested stack deploys Glue Catalog Resources (Databse, Tables) schedules"
Parameters:
  Environment:
    Type: String
  Eapplid:
    Type: String
  Medallion:
    Type: String
  SourceIdentifier:
    Type: String
  SourceIdentifierVersion:
    Type: String
  DatalakeUnibucketName:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Environment, "prod"]

Resources:
