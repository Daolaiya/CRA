  # # Glue Database
  # # Template Reference - AWS::Glue::Database - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-glue-database.html
  # #######################################

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Description: !Sub "Glue database for ${SourceIdentifier}${SourceIdentifierVersion}"
        Name: !Sub "${Environment}_${Eapplid}_${Medallion}_${SourceIdentifier}${SourceIdentifierVersion}_gluedb"

#######################################
# 1- Glue Iceberg Table TAPB
# Template Reference 
# AWS::Glue::Table - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-glue-table.html
#######################################
  GlueTableTAPB:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: "CREATE"
          Version: "2"
      TableInput:
        Description: "tapb table description"
        Name: "tapb"
        TableType: EXTERNAL_TABLE
        Parameters:
          Classification: "iceberg"
        StorageDescriptor:
          Location: !Sub "s3://${DatalakeUnibucketName}/${Medallion}/${SourceIdentifier}${SourceIdentifierVersion}/tapb/"
          Columns:
            - Name: CLT_ID_TCD
              Type: string
            - Name: PLCMT_ID
              Type: int
            - Name: CLT_ID
              Type: string
            - Name: CLT_ID_MSN
              Type: int
            - Name: TX_YR
              Type: int
            - Name: IITA_TCD
