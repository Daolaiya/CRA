AWSTemplateFormatVersion: '2010-09-09'
Description: "This nested stack deploys Glue Catalog Resources (Databse, Tables) schedules"
Parameters:
  Environment:
    Type: String
  Eapplid:
    Type: String
  Medallion:
    Type: String
  SourceIdentifier:
    Type: String
  SourceIdentifierVersion:
    Type: String
  DatalakeUnibucketName:
    Type: String
      
              
Resources:  
  # ########################################
  # # Glue Database
  # # Template Reference - AWS::Glue::Database - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-glue-database.html
  # #######################################

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Description: !Sub "Glue database for ${SourceIdentifier}${SourceIdentifierVersion}"
        Name: !Sub "${Environment}_${Eapplid}_${Medallion}_${SourceIdentifier}${SourceIdentifierVersion}_gluedb"

#######################################
# 1- Glue Iceberg Table TWFLOB
# Template Reference - AWS::Glue::Table - https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-glue-table.html
#######################################
  GlueTableTWFLOB:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: "CREATE"
          Version: "2"
      TableInput:
        Description: "Iceberg table twflob created via CloudFormation"
        Name: "twflob"
        TableType: "EXTERNAL_TABLE"
        Parameters:
          Classification: "iceberg"
        StorageDescriptor:
          Location: !Sub "s3://${DatalakeUnibucketName}/${Medallion}/${SourceIdentifier}${SourceIdentifierVersion}/twflob/"          
          Columns:
            - Name: case_area_id
              Type: int
            - Name: wfldr_id
              Type: int
            - Name: fld_id
              Type: int
            - Name: fld_val
              Type: string
            - Name: wfldr_lob_cdttm
              Type: timestamp
            - Name: ld_ind
              Type: string
            - Name: trk_tstmp
              Type: timestamp
            - Name: trk_uid
              Type: string

#######################################
# Outputs
# User Guide - CloudFormation template Outputs syntax - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#######################################
Outputs:
  GlueDatabase: 
    Value: !Ref GlueDatabase